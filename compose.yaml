services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: evolucao
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: development-only
    ports:
      - "127.0.0.1:55432:5432"
    mem_limit: 256m
    volumes:
      - evolucao_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evolucao"]
      interval: 3s
      retries: 10
volumes:
  evolucao_dev:
